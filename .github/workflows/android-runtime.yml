name: Android native startup and upgrade

on:
  push:
    branches: [lantern-android-runtime-check]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: 37
            image: system-images;android-37.0;default;x86_64
            check_background: 'true'
            cache_reopen: 'false'
            previous_version: 0.7.31
            previous_code: '64'
            previous_sha: 6dcda8e7bace0b8b5d2461c29343e91a15aaad329b15c240d9bb6f9626546449
    runs-on: ubuntu-24.04
    timeout-minutes: 34
    env:
      IMAGE: ${{ matrix.image }}
      SDK: ${{ matrix.sdk }}
      CHECK_BACKGROUND: ${{ matrix.check_background }}
      CACHE_REOPEN: ${{ matrix.cache_reopen }}
      SERIAL: emulator-5554
      PACKAGE: com.lantern.transfer
      PREVIOUS_VERSION: ${{ matrix.previous_version }}
      PREVIOUS_CODE: ${{ matrix.previous_code }}
      PREVIOUS_SHA: ${{ matrix.previous_sha }}
      NEXT_VERSION: 0.7.32
      NEXT_CODE: '65'
      NEXT_SHA: ffe811d27afba822c967f88b7a4497eb528439f13e9027045710f90cec3da974
    steps:
      - name: Test the published Android packages
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chown "$USER" /dev/kvm
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          avdmanager="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/lantern-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          "$sdkmanager" --channel=0 "emulator" "platform-tools" "$IMAGE" > "$RUNNER_TEMP/lantern-sdk.log" 2>&1 || {
            tail -n 100 "$RUNNER_TEMP/lantern-sdk.log"; exit 1;
          }
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          printf 'no\n' | "$avdmanager" create avd --name Lantern_API37 --package "$IMAGE" --device pixel_6 --force
          "$ANDROID_HOME/emulator/emulator" -avd Lantern_API37 -port 5554 -no-window -no-audio \
            -no-snapshot -no-boot-anim -gpu software -memory 6144 -partition-size 8192 \
            -camera-back none -camera-front none > "$RUNNER_TEMP/lantern-emulator.log" 2>&1 &
          emu=$!
          trap 'kill "$emu" 2>/dev/null || true' EXIT
          device() { adb -s "$SERIAL" "$@"; }
          for attempt in $(seq 1 90); do
            if ! kill -0 "$emu" 2>/dev/null; then
              tail -n 100 "$RUNNER_TEMP/lantern-emulator.log"; exit 1;
            fi
            if [ "$(device shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" = 1 ]; then break; fi
            sleep 3
          done
          test "$(device shell getprop sys.boot_completed | tr -d '\r')" = 1
          test "$(device shell getprop ro.build.version.sdk | tr -d '\r')" = "$SDK"
          for attempt in $(seq 1 24); do
            if device shell pm path android | grep -F 'package:' > "$RUNNER_TEMP/lantern-package-service.log" && device shell wm dismiss-keyguard; then
              break
            fi
            sleep 3
          done
          test -s "$RUNNER_TEMP/lantern-package-service.log"
          echo "Android guest data partition before installation"
          device shell df -h /data
          device logcat -b crash -c
          download() {
            version=$1
            digest=$2
            destination="$RUNNER_TEMP/lantern-$version.apk"
            curl -fsSLo "$destination" --retry 3 --retry-all-errors \
              "https://github.com/altale0218/lantern-releases/releases/download/v$version/Lantern-Android.apk"
            printf '%s  %s\n' "$digest" "$destination" | sha256sum -c
          }
          install_apk() {
            output="$RUNNER_TEMP/lantern-install.txt"
            for attempt in {1..10}; do
              if device install --no-streaming "$@" > "$output" 2>&1; then
                cat "$output"
                return 0
              fi
              cat "$output"
              if ! grep -Eqi "Can.t find service|DEAD_OBJECT|broken pipe|device offline" "$output"; then return 1; fi
              sleep 3
            done
            return 1
          }
          startup() {
            code=$1
            version=$2
            rm -f "$RUNNER_TEMP/lantern-pid.log" "$RUNNER_TEMP/lantern-activity.log"
            device shell dumpsys package "$PACKAGE" | grep -F "versionCode=$code " > "$RUNNER_TEMP/lantern-version.log"
            launcher="$PACKAGE/.StartupActivity"
            echo "Selected launcher component: $launcher"
            device shell am force-stop --user 0 "$PACKAGE"
            device logcat -b crash -c
            started=false
            for launch_attempt in 1 2 3; do
              if device shell am start -W -n "$launcher" > "$RUNNER_TEMP/lantern-launch.log" 2>&1; then
                cat "$RUNNER_TEMP/lantern-launch.log"
                started=true
                break
              fi
              cat "$RUNNER_TEMP/lantern-launch.log"
              if ! grep -Eqi 'broken pipe|deadobject' "$RUNNER_TEMP/lantern-launch.log"; then break; fi
              sleep 3
            done
            if [ "$started" != true ]; then
              device logcat -b crash -d | tail -n 48 || true
              exit 1
            fi
            for attempt in $(seq 1 30); do
              if device shell dumpsys activity activities | grep -E "([Tt]opResumedActivity|mResumedActivity).*com\.lantern\.transfer/(\.MainActivity|com\.lantern\.transfer\.MainActivity)" > "$RUNNER_TEMP/lantern-activity.log" && device shell pidof "$PACKAGE" > "$RUNNER_TEMP/lantern-pid.log"; then
                break
              fi
              sleep 2
            done
            if [ ! -s "$RUNNER_TEMP/lantern-pid.log" ] || [ ! -s "$RUNNER_TEMP/lantern-activity.log" ]; then
              device shell dumpsys activity activities | grep -E "ResumedActivity|com\.lantern\.transfer" || true
              device logcat -b crash -d | grep -A 24 -F "Process: $PACKAGE" || true
              exit 1
            fi
            sleep 3
            device shell pidof "$PACKAGE"
            if device logcat -b crash -d | grep -A 24 -F "Process: $PACKAGE"; then exit 1; fi
            echo "PASS Lantern $version started the native Android main activity on API $SDK"
          }
          download "$PREVIOUS_VERSION" "$PREVIOUS_SHA"
          install_apk "$RUNNER_TEMP/lantern-$PREVIOUS_VERSION.apk"
          startup "$PREVIOUS_CODE" "$PREVIOUS_VERSION"
          if [ "$CHECK_BACKGROUND" = true ]; then
            if [ "$SDK" = 37 ]; then
              device shell pm grant "$PACKAGE" android.permission.POST_NOTIFICATIONS
            else
              device shell am force-stop "$PACKAGE"
              device shell pm grant "$PACKAGE" android.permission.POST_NOTIFICATIONS
              device shell am start -W -n "$PACKAGE/.StartupActivity"
            fi
            python3 - <<'PY'
          import os
          import re
          import subprocess
          import time
          from xml.etree import ElementTree as ET

          serial = os.environ["SERIAL"]
          expected = os.environ["NEXT_VERSION"]
          expected_code = "versionCode=" + os.environ["NEXT_CODE"] + " "
          package = os.environ["PACKAGE"]
          def adb(*args):
              return subprocess.run(["adb", "-s", serial, *args], text=True,
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=28, check=True).stdout
          def tree():
              try:
                  adb("shell", "uiautomator", "dump", "/sdcard/lantern-test.xml")
                  return list(ET.fromstring(adb("shell", "cat", "/sdcard/lantern-test.xml")).iter("node"))
              except (subprocess.SubprocessError, ET.ParseError):
                  return []
          def labels(node):
              return [node.get("text", "").strip(), node.get("content-desc", "").strip()]
          size = re.findall(r"(\d+)x(\d+)", adb("shell", "wm", "size"))
          display_width, display_height = map(int, size[-1])
          def click_node(node):
              left, top, right, bottom = map(int, re.findall(r"\d+", node.attrib["bounds"]))
              x, y = (left + right)//2, (top + bottom)//2
              if node.get("package") == package and any(s in ("打开系统设置", "检查更新", "下载更新", "安装更新") for s in labels(node)):
                  if y > display_height * 0.87 or bottom - top < 24:
                      mid = str(display_width//2)
                      adb("shell", "input", "swipe", mid, str(display_height*72//100),
                          mid, str(display_height*40//100), "350")
                      return False
                  print("Update action safely within app content:", labels(node)[0],
                      "vertical position", round(y/display_height, 2), flush=True)
              adb("shell", "input", "tap", str(x), str(y))
              return True
          def wait_for(predicate, description, seconds=70, tap=False):
              deadline = time.monotonic() + seconds
              recent = []
              while time.monotonic() < deadline:
                  recent = tree()
                  for node in recent:
                      if predicate(node):
                          if tap and not click_node(node):
                              break
                          return
                  time.sleep(1)
              print("Visible test labels:", [(n.get("class"), n.get("resource-id"), text)
                  for n in recent for text in labels(n) if text][-32:])
              crash = adb("shell", "logcat", "-d", "-b", "crash", "-v", "brief", "-t", "36")
              for line in crash.splitlines():
                  if "FATAL EXCEPTION:" in line or "com.lantern.transfer" in line or re.search(r"Exception:", line):
                      print("Crash buffer:", line.split(" /data/")[0][:200])
              raise RuntimeError(description)
          def text_button(text, seconds=70, button_only=False):
              wait_for(lambda n: text in labels(n) and (not button_only or n.get("class") == "android.widget.Button"), "Missing control: " + text, seconds, tap=True)
          def has_permission():
              return bool(re.search(r"REQUEST_INSTALL_PACKAGES:\s*allow", adb("shell", "appops", "get",
                  package, "REQUEST_INSTALL_PACKAGES")))
          for _ in range(22):
              nodes = tree()
              update = next((n for n in nodes if "更新中心" in labels(n)), None)
              if update is not None:
                  click_node(update)
                  break
              action = next((n for n in nodes if "跳过引导" in labels(n)), None)
              if action is None:
                  action = next((n for n in nodes if "开始使用" in labels(n)), None)
              if action is not None:
                  click_node(action)
              time.sleep(1)
          else:
              print("Last onboarding labels:", [(n.get("class"), n.get("package"), value)
                  for n in nodes for value in labels(n) if value][-35:])
              print("Visible Android WebView providers:", "\n".join(adb("shell", "dumpsys", "webviewupdate").splitlines()[:18]))
              print("Focused activity:", "\n".join(line for line in adb("shell", "dumpsys", "activity", "activities").splitlines()
                  if "ResumedActivity" in line)[-1400:])
              raise RuntimeError("Could not enter the update center after onboarding")
          assert not has_permission(), "The fresh test app unexpectedly started with installation permission"
          text_button("打开系统设置", button_only=True)
          wait_for(lambda n: n.get("package", "") == "com.android.settings" and n.get("checkable") == "true",
              "The system did not expose the install-from-this-source switch", tap=True)
          deadline = time.monotonic() + 20
          while time.monotonic() < deadline and not has_permission():
              time.sleep(1)
          assert has_permission(), "The OS did not grant the permission after the user action"
          print("PASS Android presented the system installation-source switch and the user action granted it")
          adb("shell", "input", "keyevent", "KEYCODE_BACK")
          wait_for(lambda n: "稳定版" in labels(n) or (
              "更新渠道" in labels(n) and (n.get("clickable") == "true" or n.get("class") == "android.widget.Spinner")),
              "The update channel selection control is not visible", tap=True)
          text_button("测试版")
          text_button("检查更新", button_only=True)
          title = "Lantern " + expected
          wait_for(lambda n: any(s == title or s.startswith(title + " · ") for s in labels(n)),
              "Expected public test release is not visible", 95)
          print("PASS Android update page showed the expected public beta before download:", expected)
          text_button("下载更新", 95, button_only=True)
          wait_for(lambda n: "安装更新" in labels(n), "Verified download was not offered for install", 150)
          print("PASS Android app selected beta, found the server release, downloaded and verified the APK")
          if os.environ.get("CACHE_REOPEN") == "true":
              adb("shell", "am", "force-stop", package)
              adb("shell", "am", "start", "-W", "-n", package + "/.StartupActivity")
              wait_for(lambda n: n.get("clickable") == "true" and
                  any(s in ("查看并安装", "更新中心") for s in labels(n)),
                  "The reopened app did not show the verified-package prompt or update entry", 90, tap=True)
              wait_for(lambda n: "安装更新" in labels(n),
                  "The verified package was not restored after a full process restart", 100)
              assert has_permission(), "The previously granted install permission disappeared"
              print("PASS Android restored the verified download and install permission after process restart")
          text_button("安装更新")
          wait_for(lambda n: n.get("package", "").endswith("packageinstaller") and
              any(s.lower() in ("update", "install") for s in labels(n)),
              "Android system package install confirmation is not visible", 90, tap=True)
          deadline = time.monotonic() + 90
          while time.monotonic() < deadline:
              if expected_code in adb("shell", "dumpsys", "package", package):
                  print("PASS Android system installed the user-confirmed server OTA:", expected_code)
                  break
              time.sleep(2)
          else:
              raise RuntimeError("The system did not install the confirmed APK")
          wait_for(lambda n: n.get("package", "").endswith("packageinstaller") and
              any(s.lower() == "done" for s in labels(n)),
              "The Android installation success dialog did not offer Done", 60, tap=True)
          deadline = time.monotonic() + 30
          while time.monotonic() < deadline:
              activities = adb("shell", "dumpsys", "activity", "activities")
              if not any("packageinstaller" in line and "ResumedActivity" in line for line in activities.splitlines()):
                  print("PASS Android system installer reported success and dismissed its confirmation screen")
                  break
              time.sleep(2)
          else:
              raise RuntimeError("The system installer remained in front after Done")
          PY
            startup "$NEXT_CODE" "$NEXT_VERSION"
          fi
          if [ "$CHECK_BACKGROUND" != true ]; then
            download "$NEXT_VERSION" "$NEXT_SHA"
            install_apk -r "$RUNNER_TEMP/lantern-$NEXT_VERSION.apk"
            startup "$NEXT_CODE" "$NEXT_VERSION"
          fi
          echo "PASS same-signature upgrade preserved the application package"
          if [ "$CHECK_BACKGROUND" != true ]; then exit 0; fi
          original_pid="$(device shell pidof "$PACKAGE" | tr -d '\r')"
          echo "PID before Home: $original_pid"
          device shell input keyevent KEYCODE_HOME
          backgrounded=false
          for attempt in $(seq 1 12); do
            if ! device shell dumpsys activity activities | grep -E "([Tt]opResumedActivity|mResumedActivity).*com\.lantern\.transfer/"; then
              backgrounded=true; break
            fi
            sleep 1
          done
          test "$backgrounded" = true
          sleep 3
          background_pid="$(device shell pidof "$PACKAGE" | tr -d '\r' || true)"
          echo "PID while backgrounded: $background_pid"
          resumed=false
          for launch_attempt in 1 2 3; do
            if device shell am start --user 0 -W -n "$PACKAGE/.StartupActivity" > "$RUNNER_TEMP/lantern-resume-launch.log" 2>&1; then
              cat "$RUNNER_TEMP/lantern-resume-launch.log"
              resumed=true
              break
            fi
            cat "$RUNNER_TEMP/lantern-resume-launch.log"
            if ! grep -Eqi 'broken pipe|deadobject|Error type 3|Can.t find service' "$RUNNER_TEMP/lantern-resume-launch.log"; then break; fi
            sleep 3
          done
          test "$resumed" = true
          for attempt in $(seq 1 16); do
            if device shell dumpsys activity activities | grep -E "([Tt]opResumedActivity|mResumedActivity).*com\.lantern\.transfer/(\.MainActivity|com\.lantern\.transfer\.MainActivity)" > "$RUNNER_TEMP/lantern-resumed.log"; then break; fi
            sleep 1
          done
          test -s "$RUNNER_TEMP/lantern-resumed.log"
          resumed_pid="$(device shell pidof "$PACKAGE" | tr -d '\r')"
          echo "PID after resume: $resumed_pid"
          if [ "$resumed_pid" != "$original_pid" ]; then
            device shell dumpsys activity exit-info "$PACKAGE" | grep -Ei 'reason=|subreason=|description=' | head -12 || true
          fi
          if device logcat -b crash -d | grep -A 24 -F "Process: $PACKAGE"; then exit 1; fi
          echo "PASS Android launcher displayed the native activity after Home; see the recorded PIDs"
