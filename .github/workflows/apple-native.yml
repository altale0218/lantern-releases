name: Apple simulator build

on:
  push:
    branches: [lantern-ios-runtime-check]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            rid: iossimulator-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_SDK: 10.0.300
      SIMULATOR_RID: ${{ matrix.rid }}
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: v0.7.23
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.300'
      - name: Create and start a fresh iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          runtime="$(xcrun simctl list runtimes --json | python3 -c 'import json,sys; runtimes=[r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")]; print(max(runtimes,key=lambda r:tuple(map(int,r["version"].split("."))))["identifier"])')"
          device="$(xcrun simctl create Lantern-CI com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro "$runtime")"
          echo "LANTERN_SIMULATOR=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device"
      - name: Build the iPhone and iPad simulator app
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          dotnet new globaljson --sdk-version "$DOTNET_SDK" --roll-forward disable --force
          test "$(dotnet --version)" = "$DOTNET_SDK"
          xcodebuild -version
          dotnet workload install ios --version "$DOTNET_SDK"
          dotnet build "$GITHUB_WORKSPACE/src/Lantern.iOS/Lantern.iOS.csproj" -c Debug -r "$SIMULATOR_RID" -p:EnableCodeSigning=false -p:LanternIosSdkVersion=26.2
      - name: Check the bundled interface and metadata
        shell: bash
        run: |
          set -euo pipefail
          bundle="$(find src/Lantern.iOS/bin/Debug -type d -name '*.app' -print -quit)"
          test -n "$bundle"
          test -f "$bundle/ui/index.html"
          test -f "$bundle/PrivacyInfo.xcprivacy"
          plutil -lint -- "$bundle/Info.plist" "$bundle/PrivacyInfo.xcprivacy"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$bundle/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$bundle/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSBonjourServices' "$bundle/Info.plist"
      - name: Apply simulator-only ad hoc signatures
        shell: bash
        run: |
          set -euo pipefail
          app="$(find src/Lantern.iOS/bin/Debug -type d -name '*.app' -print -quit)"
          test -n "$app"
          while IFS= read -r -d '' native; do
            codesign --force --sign - --timestamp=none "$native"
          done < <(find "$app" -type f \( -name '*.dylib' -o -name '*.so' \) -print0)
          while IFS= read -r -d '' embedded; do
            codesign --force --sign - --timestamp=none "$embedded"
          done < <(find "$app" -depth -type d \( -name '*.framework' -o -name '*.appex' \) -print0)
          codesign --force --sign - --timestamp=none "$app"
          codesign --verify --deep --strict "$app"
      - name: Launch the app in an iPhone simulator
        timeout-minutes: 14
        shell: bash
        run: |
          set -euo pipefail
          app="$(find src/Lantern.iOS/bin/Debug -type d -name '*.app' -print -quit)"
          app_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          device="${LANTERN_SIMULATOR:?the simulator was not created}"
          trap 'xcrun simctl shutdown "$device" >/dev/null 2>&1 || true' EXIT
          if ! xcrun simctl bootstatus "$device" > "$RUNNER_TEMP/lantern-ios-boot.log" 2>&1; then
            tail -n 35 "$RUNNER_TEMP/lantern-ios-boot.log"
            exit 1
          fi
          xcrun simctl install "$device" "$app"
          xcrun simctl launch --terminate-running-process "$device" "$app_id" | tee "$RUNNER_TEMP/lantern-ios-launch.log"
          pid="$(awk 'END {print $NF}' "$RUNNER_TEMP/lantern-ios-launch.log")"
          [[ "$pid" =~ ^[0-9]+$ ]]
          data="$(xcrun simctl get_app_container "$device" "$app_id" data)"
          for attempt in 1 2 3 4 5 6; do
            sleep 5
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            if test -d "$data/Library/Application Support/Lantern"; then
              echo "PASS Apple Silicon iPhone simulator reached native data setup and remained alive"
              exit 0
            fi
          done
          xcrun simctl spawn "$device" log show --last 2m --style compact \
            --predicate "processID == $pid OR eventMessage CONTAINS[c] \"$app_id\"" \
            | grep -Ei 'SIG|terminate|fatal|crash|exception|symbol not found' | tail -n 25 || true
          exit 1
