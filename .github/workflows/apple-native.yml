name: Apple simulator signing and WebView smoke

on:
  push:
    branches: [lantern-ios-runtime-check]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: iossimulator-arm64
            family: iPhone
            type: com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro
          - runner: macos-26
            target: iossimulator-arm64
            family: iPad
            type: com.apple.CoreSimulator.SimDeviceType.iPad-Air-13-inch-M4
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 26
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      DOTNET_SDK: 10.0.401
      DEVICE_TYPE: ${{ matrix.type }}
      DEVICE_FAMILY: ${{ matrix.family }}
      SIMULATOR_RID: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v0.7.32
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - name: Build the released client with simulator observations
        shell: bash
        run: |
          set -euo pipefail
          runtime="$(xcrun simctl list runtimes --json | python3 -c 'import json,sys; runtimes=[r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")]; print(max(runtimes,key=lambda r:tuple(map(int,r["version"].split("."))))["identifier"])')"
          device="$(xcrun simctl create "LanternBridge-$DEVICE_FAMILY" "$DEVICE_TYPE" "$runtime")"
          echo "LANTERN_SIMULATOR=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/Lantern.iOS/LanternTabs.cs")
          text = path.read_text()
          def before(line, statement):
              global text
              assert text.count(line) == 1, line
              text = text.replace(line, statement + "\n            " + line)
          before("private bool showingWebModal;", "private bool uiProbeRendered;")
          before("await (initializing ?? Task.CompletedTask);", 'ObserveSmoke("Bridge accepted ready");')
          before("ready = true;", 'ObserveSmoke("Native controller ready");')
          before("lastState = state;", """
                      if (!uiProbeRendered)
                      {
                          var visible = await web.EvaluateJavaScriptAsync("Boolean(document.querySelector('.release-send-card')?.getClientRects().length)");
                          if (visible is NSNumber result && result.BoolValue)
                          {
                              uiProbeRendered = true;
                              ObserveSmoke("WebView send page rendered");
                          }
                      }""")
          before("suspended = false;", 'if (ready) ObserveSmoke("Native scene active again");')
          before("suspended = true;", 'if (ready) ObserveSmoke("Native scene suspended");')
          before("if (closing) return;\n            if (id > 0)", """
                      if (!ready)
                      {
                          ObserveSmoke("Initialization exception: " + error.GetType().Name + ":" + error.HResult);
                          if (error.Message.StartsWith("无法访问设备钥匙串", StringComparison.Ordinal))
                              ObserveSmoke(error.Message);
                      }
                  """)
          marker = "    private void Evaluate(string script)"
          assert text.count(marker) == 1
          text = text.replace(marker, """    private static void ObserveSmoke(string value)
              {
                  try { File.AppendAllText(Path.Combine(Path.GetTempPath(), "lantern-bridge-smoke.txt"), value + Environment.NewLine); }
                  catch (IOException) { }
              }

          """ + marker)
          path.write_text(text)
          store = Path("src/Lantern.iOS/KeychainStore.cs")
          source = store.read_text()
          keychain_marker = "        return Task.FromResult<string?>(NSString.FromData"
          assert source.count(keychain_marker) == 1
          source = source.replace(keychain_marker, """        if (key == "lantern.identity")
                      File.WriteAllText(Path.Combine(Path.GetTempPath(), "lantern-identity-reused.txt"), "existing identity read");
          """ + keychain_marker)
          store.write_text(source)
          PY
          cd "$RUNNER_TEMP"
          cat > "$RUNNER_TEMP/lantern-sim-entitlements.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>application-identifier</key><string>com.lantern.transfer</string>
            <key>keychain-access-groups</key><array><string>com.lantern.transfer</string></array>
          </dict>
          </plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/lantern-sim-entitlements.plist"
          dotnet new globaljson --sdk-version "$DOTNET_SDK" --roll-forward disable --force
          dotnet workload install ios --version "$DOTNET_SDK"
          dotnet build "$GITHUB_WORKSPACE/src/Lantern.iOS/Lantern.iOS.csproj" -c Debug -r "$SIMULATOR_RID" \
            -p:EnableCodeSigning=true -p:CodesignKey=- -p:CodesignRequireProvisioningProfile=false \
            "-p:CodesignEntitlements=$RUNNER_TEMP/lantern-sim-entitlements.plist"
      - name: Check iOS bridge readiness and app lifecycle
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          device="$LANTERN_SIMULATOR"
          trap 'xcrun simctl shutdown "$device" >/dev/null 2>&1 || true' EXIT
          app="$(find src/Lantern.iOS/bin/Debug -type d -name '*.app' -print -quit)"
          test -f "$app/ui/index.html"
          test -f "$app/PrivacyInfo.xcprivacy"
          id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          test "$id" = com.lantern.transfer
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" = 0.7.32
          codesign --verify --deep --strict "$app"
          xcrun simctl bootstatus "$device"
          xcrun simctl install "$device" "$app"
          if ! xcrun simctl launch --terminate-running-process "$device" "$id" | tee "$RUNNER_TEMP/lantern-bridge-launch.txt"; then
            xcrun simctl spawn "$device" log show --last 45s --predicate 'eventMessage CONTAINS[c] "com.lantern.transfer"' | tail -n 38
            exit 1
          fi
          pid="$(awk 'END {print $NF}' "$RUNNER_TEMP/lantern-bridge-launch.txt")"
          [[ "$pid" =~ ^[0-9]+$ ]]
          data="$(xcrun simctl get_app_container "$device" "$id" data)"
          phase="$data/tmp/lantern-bridge-smoke.txt"
          wait_for_phase() {
            local target="$1"
            for attempt in {1..22}; do
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              if [[ -f "$phase" ]] && grep -Fxq "$target" "$phase"; then return 0; fi
              sleep 2
            done
            if [[ -f "$phase" ]]; then cat "$phase"; fi
            return 1
          }
          wait_for_phase 'WebView send page rendered'
          grep -Fx 'Bridge accepted ready' "$phase"
          grep -Fx 'Native controller ready' "$phase"
          test -f "$data/Library/Application Support/Lantern/settings.json"
          echo "PASS $DEVICE_FAMILY initialized the bridge and created the rendered send page"
          xcrun simctl launch "$device" com.apple.Preferences
          wait_for_phase 'Native scene suspended'
          xcrun simctl launch "$device" "$id" | tee "$RUNNER_TEMP/lantern-bridge-resume.txt"
          test "$(awk 'END {print $NF}' "$RUNNER_TEMP/lantern-bridge-resume.txt")" = "$pid"
          wait_for_phase 'Native scene active again'
          echo "PASS $DEVICE_FAMILY returned to the same Lantern process"
          identity_phase="$data/tmp/lantern-identity-reused.txt"
          test ! -f "$identity_phase"
          xcrun simctl terminate "$device" "$id"
          rm -f "$phase"
          xcrun simctl launch "$device" "$id" | tee "$RUNNER_TEMP/lantern-bridge-cold-restart.txt"
          restarted_pid="$(awk 'END {print $NF}' "$RUNNER_TEMP/lantern-bridge-cold-restart.txt")"
          test "$restarted_pid" != "$pid"
          [[ "$restarted_pid" =~ ^[0-9]+$ ]]
          pid="$restarted_pid"
          wait_for_phase 'WebView send page rendered'
          grep -Fxq 'existing identity read' "$identity_phase"
          echo "PASS $DEVICE_FAMILY reused its Keychain identity on cold restart"

  device-build:
    runs-on: macos-26
    timeout-minutes: 24
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v0.7.32
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - name: Build the released iPhone and iPad device target
        shell: bash
        run: |
          set -euo pipefail
          test "$(dotnet --version)" = 10.0.401
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = 26.5
          dotnet workload install ios --version 10.0.401
          dotnet build src/Lantern.iOS/Lantern.iOS.csproj -c Release -r ios-arm64 -p:EnableCodeSigning=false
          app="$(find src/Lantern.iOS/bin/Release -type d -name '*.app' -print -quit)"
          test -f "$app/PrivacyInfo.xcprivacy"
          test -f "$app/ui/index.html"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" = 0.7.32
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          file "$app/$executable" | grep 'arm64'
          xcrun vtool -show-build "$app/$executable" | grep -E 'platform[[:space:]]+IOS[[:space:]]*$'
          echo "PASS released iOS device target built with the documented default toolchain"
