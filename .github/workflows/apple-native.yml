name: Apple simulator build

on:
  push:
    branches: [lantern-ios-runtime-check]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26-intel
            rid: iossimulator-arm64
          - os: macos-26-intel
            rid: iossimulator-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_SDK: 10.0.401
      SIMULATOR_RID: ${{ matrix.rid }}
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - name: Create and start a fresh iPhone simulator
        if: ${{ matrix.rid == 'iossimulator-x64' }}
        shell: bash
        run: |
          set -euo pipefail
          runtime="$(xcrun simctl list runtimes --json | python3 -c 'import json,sys; runtimes=[r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")]; print(max(runtimes,key=lambda r:tuple(map(int,r["version"].split("."))))["identifier"])')"
          device="$(xcrun simctl create Lantern-CI com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro "$runtime")"
          echo "LANTERN_SIMULATOR=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device"
      - name: Build the iPhone and iPad simulator app
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          dotnet new globaljson --sdk-version "$DOTNET_SDK" --roll-forward disable --force
          test "$(dotnet --version)" = "$DOTNET_SDK"
          xcodebuild -version
          dotnet workload install ios --version "$DOTNET_SDK"
          dotnet build "$GITHUB_WORKSPACE/src/Lantern.iOS/Lantern.iOS.csproj" -c Debug -r "$SIMULATOR_RID" -p:EnableCodeSigning=false
      - name: Check the bundled interface and metadata
        shell: bash
        run: |
          set -euo pipefail
          bundle="$(find src/Lantern.iOS/bin/Debug -type d -name '*.app' -print -quit)"
          test -n "$bundle"
          test -f "$bundle/ui/index.html"
          test -f "$bundle/PrivacyInfo.xcprivacy"
          plutil -lint -- "$bundle/Info.plist" "$bundle/PrivacyInfo.xcprivacy"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$bundle/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$bundle/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSBonjourServices' "$bundle/Info.plist"
      - name: Launch the app in an iPhone simulator
        if: ${{ matrix.rid == 'iossimulator-x64' }}
        timeout-minutes: 14
        shell: bash
        run: |
          set -euo pipefail
          app="$(find src/Lantern.iOS/bin/Debug -type d -name '*.app' -print -quit)"
          app_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          device="${LANTERN_SIMULATOR:?the simulator was not created}"
          trap 'xcrun simctl shutdown "$device" >/dev/null 2>&1 || true' EXIT
          if ! xcrun simctl bootstatus "$device" > "$RUNNER_TEMP/lantern-ios-boot.log" 2>&1; then
            tail -n 35 "$RUNNER_TEMP/lantern-ios-boot.log"
            exit 1
          fi
          xcrun simctl install "$device" "$app"
          xcrun simctl launch --terminate-running-process --stdout "$RUNNER_TEMP/lantern-app-out.log" \
            --stderr "$RUNNER_TEMP/lantern-app-error.log" "$device" "$app_id" | tee "$RUNNER_TEMP/lantern-ios-launch.log"
          pid="$(awk 'END {print $NF}' "$RUNNER_TEMP/lantern-ios-launch.log")"
          [[ "$pid" =~ ^[0-9]+$ ]]
          sleep 10
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "iPhone simulator app exited early; collecting only relevant failure details"
            grep -Eh 'Unhandled|Exception|Error|Abort|Fatal|^   at ' "$RUNNER_TEMP/lantern-app-out.log" "$RUNNER_TEMP/lantern-app-error.log" | tail -n 25 || true
            executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
            xcrun simctl spawn "$device" log show --last 2m --style compact \
              --predicate "process == \"$executable\" OR eventMessage CONTAINS[c] \"$app_id\"" \
              | grep -Ei 'Unhandled|Abort|dyld|Fatal|Symbol not found|Exception|crashed|termination|exited' | tail -n 25 || true
            find "$HOME/Library/Logs/DiagnosticReports" -type f -name '*Lantern*.ips' -mmin -10 -print0 | while IFS= read -r -d '' report; do
              python3 - "$report" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              stream.readline()
              data=json.load(stream)
          exception=data.get("exception") or {}
          termination=data.get("termination") or {}
          print("Crash signal:", exception.get("type"), exception.get("signal"))
          print("Crash termination:", termination.get("namespace"), termination.get("code"), termination.get("indicator"))
          for detail in data.get("asi", {}).values():
              for line in detail:
                  if any(marker in line for marker in ("Symbol not found", "Library not loaded", "no suitable image", "Assertion failed")):
                      print(line.rsplit("/",1)[-1][:180])
          PY
            done
            exit 1
          fi
          echo "PASS iPhone simulator launch completed, and the process is still running"
