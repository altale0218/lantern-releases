name: Apple simulator release smoke

on:
  push:
    branches: [lantern-ios-runtime-check]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            rid: iossimulator-x64
            model: iPhone
            type: com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro
          - runner: macos-15-intel
            rid: iossimulator-x64
            model: iPad
            type: com.apple.CoreSimulator.SimDeviceType.iPad-Air-13-inch-M3
          - runner: macos-15
            rid: iossimulator-arm64
            model: iPhone
            type: com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro
          - runner: macos-15
            rid: iossimulator-arm64
            model: iPad
            type: com.apple.CoreSimulator.SimDeviceType.iPad-Air-13-inch-M3
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 33
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_SDK: 10.0.300
      SIMULATOR_RID: ${{ matrix.rid }}
      DEVICE_TYPE: ${{ matrix.type }}
      DEVICE_MODEL: ${{ matrix.model }}
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      LANTERN_VERSION: 0.7.29
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: v0.7.29
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.300'
      - name: Start a new Apple simulator
        shell: bash
        run: |
          set -euo pipefail
          runtime="$(xcrun simctl list runtimes --json | python3 -c 'import json,sys; runtimes=[r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")]; print(max(runtimes,key=lambda r:tuple(map(int,r["version"].split("."))))["identifier"])')"
          device="$(xcrun simctl create "Lantern-$DEVICE_MODEL" "$DEVICE_TYPE" "$runtime")"
          echo "LANTERN_SIMULATOR=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device"
      - name: Build exact release sources
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          dotnet new globaljson --sdk-version "$DOTNET_SDK" --roll-forward disable --force
          test "$(dotnet --version)" = "$DOTNET_SDK"
          xcodebuild -version
          dotnet workload install ios --version "$DOTNET_SDK"
          dotnet build "$GITHUB_WORKSPACE/src/Lantern.iOS/Lantern.iOS.csproj" -c Debug -r "$SIMULATOR_RID" -p:EnableCodeSigning=false -p:LanternIosSdkVersion=26.2
      - name: Verify window, first screen and foreground return
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          device="$LANTERN_SIMULATOR"
          trap 'xcrun simctl shutdown "$device" >/dev/null 2>&1 || true' EXIT
          cd "$GITHUB_WORKSPACE"
          app="$(find src/Lantern.iOS/bin/Debug -type d -name '*.app' -print -quit)"
          test -f "$app/ui/index.html"
          test -f "$app/PrivacyInfo.xcprivacy"
          plutil -lint -- "$app/Info.plist" "$app/PrivacyInfo.xcprivacy"
          id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")"
          test "$id" = com.lantern.transfer && test "$version" = "$LANTERN_VERSION"
          while IFS= read -r -d '' native; do
            codesign --force --sign - --timestamp=none "$native"
          done < <(find "$app" -type f \( -name '*.dylib' -o -name '*.so' \) -print0)
          while IFS= read -r -d '' framework; do
            codesign --force --sign - --timestamp=none "$framework"
          done < <(find "$app" -depth -type d -name '*.framework' -print0)
          codesign --force --sign - --timestamp=none "$app"
          codesign --verify --deep --strict "$app"
          xcrun simctl bootstatus "$device"
          xcrun simctl status_bar "$device" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          xcrun simctl install "$device" "$app"
          xcrun simctl launch --terminate-running-process "$device" "$id" | tee "$RUNNER_TEMP/lantern-launch.txt"
          pid="$(awk 'END {print $NF}' "$RUNNER_TEMP/lantern-launch.txt")"
          [[ "$pid" =~ ^[0-9]+$ ]]
          data="$(xcrun simctl get_app_container "$device" "$id" data)"
          for attempt in {1..15}; do
            kill -0 "$pid"
            if [[ -f "$data/Library/Application Support/Lantern/settings.json" ]]; then break; fi
            sleep 2
          done
          test -f "$data/Library/Application Support/Lantern/settings.json"
          echo "PASS $DEVICE_MODEL native identity and preferences initialized for Lantern $version"
          cat > "$RUNNER_TEMP/ReadLanternScreen.swift" <<'SWIFT'
          import Foundation
          import Vision

          let screenshot = URL(fileURLWithPath: CommandLine.arguments[1])
          let version = CommandLine.arguments[2].filter(\.isNumber)
          let request = VNRecognizeTextRequest()
          request.recognitionLevel = .accurate
          let supported = try request.supportedRecognitionLanguages()
          request.recognitionLanguages = ["zh-Hans", "en-US"].filter { supported.contains($0) }
          let handler = VNImageRequestHandler(url: screenshot, options: [:])
          try handler.perform([request])
          let strings = request.results?.compactMap { $0.topCandidates(1).first?.string } ?? []
          let text = strings.joined(separator: " ")
          let content = text.lowercased().filter { $0.isLetter || $0.isNumber }
          let webLabels = ["选择文件", "发送文件", "发现身边", "附近的设备", "配对新设备", "跳过引导", "开始使用", "文件轻松互传"]
          let matched = webLabels.filter { content.contains($0) }
          let windowText = ["启动失败", "传输", "进度", "聊天", "设置", "重新打开"].filter { content.contains($0) }
          print("Text observations: \(strings.count), known web labels: \(matched), window labels: \(windowText)")
          if matched.isEmpty && !(content.contains("lantern") && content.contains(version)) {
              print("Expected Lantern web content was not recognized")
              exit(1)
          }
          SWIFT
          xcrun swiftc "$RUNNER_TEMP/ReadLanternScreen.swift" -o "$RUNNER_TEMP/read-lantern-screen"
          check_screen() {
            for attempt in {1..5}; do
              kill -0 "$pid"
              xcrun simctl io "$device" screenshot "$RUNNER_TEMP/lantern-screen.png"
              if "$RUNNER_TEMP/read-lantern-screen" "$RUNNER_TEMP/lantern-screen.png" "$version"; then return 0; fi
              sleep 2
            done
            return 1
          }
          check_screen
          echo "PASS $DEVICE_MODEL rendered the Lantern web interface inside the native window"
          xcrun simctl launch "$device" com.apple.Preferences
          sleep 3
          kill -0 "$pid"
          xcrun simctl launch "$device" "$id" | tee "$RUNNER_TEMP/lantern-resume.txt"
          resumed="$(awk 'END {print $NF}' "$RUNNER_TEMP/lantern-resume.txt")"
          test "$resumed" = "$pid"
          check_screen
          echo "PASS $DEVICE_MODEL returned to the original Lantern process after leaving the app"
