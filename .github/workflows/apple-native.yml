name: Apple simulator build

on:
  push:
    branches: [lantern-ios-runtime-check]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            rid: iossimulator-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_SDK: 10.0.300
      SIMULATOR_RID: ${{ matrix.rid }}
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: v0.7.24
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.300'
      - name: Create and start a fresh iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          runtime="$(xcrun simctl list runtimes --json | python3 -c 'import json,sys; runtimes=[r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")]; print(max(runtimes,key=lambda r:tuple(map(int,r["version"].split("."))))["identifier"])')"
          device="$(xcrun simctl create Lantern-CI com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro "$runtime")"
          echo "LANTERN_SIMULATOR=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device"
      - name: Build the iPhone and iPad simulator app
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          dotnet new globaljson --sdk-version "$DOTNET_SDK" --roll-forward disable --force
          test "$(dotnet --version)" = "$DOTNET_SDK"
          xcodebuild -version
          dotnet workload install ios --version "$DOTNET_SDK"
          dotnet build "$GITHUB_WORKSPACE/src/Lantern.iOS/Lantern.iOS.csproj" -c Debug -r "$SIMULATOR_RID" -p:EnableCodeSigning=false -p:LanternIosSdkVersion=26.2
      - name: Check the bundled interface and metadata
        shell: bash
        run: |
          set -euo pipefail
          bundle="$(find src/Lantern.iOS/bin/Debug -type d -name '*.app' -print -quit)"
          test -n "$bundle"
          test -f "$bundle/ui/index.html"
          test -f "$bundle/PrivacyInfo.xcprivacy"
          plutil -lint -- "$bundle/Info.plist" "$bundle/PrivacyInfo.xcprivacy"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$bundle/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$bundle/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSBonjourServices' "$bundle/Info.plist"
      - name: Compare the stock UIKit template with Lantern
        timeout-minutes: 17
        shell: bash
        run: |
          set -euo pipefail
          device="$LANTERN_SIMULATOR"
          trap 'xcrun simctl shutdown "$device" >/dev/null 2>&1 || true' EXIT
          xcrun simctl bootstatus "$device"
          tool_fixture="$RUNNER_TEMP/UIKitFixture"
          cd "$RUNNER_TEMP"
          dotnet new list ios
          dotnet new ios -o "$tool_fixture"
          template_project="$(find "$tool_fixture" -maxdepth 1 -name '*.csproj' -print -quit)"
          test -n "$template_project"
          dotnet build "$template_project" -c Debug -r "$SIMULATOR_RID" -p:EnableCodeSigning=false
          sign_and_launch() {
            app="$1"
            label="$2"
            bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
            while IFS= read -r -d '' native; do
              codesign --force --sign - --timestamp=none "$native"
            done < <(find "$app" -type f \( -name '*.dylib' -o -name '*.so' \) -print0)
            while IFS= read -r -d '' framework; do
              codesign --force --sign - --timestamp=none "$framework"
            done < <(find "$app" -depth -type d -name '*.framework' -print0)
            codesign --force --sign - --timestamp=none "$app"
            codesign --verify --deep --strict "$app"
            xcrun simctl install "$device" "$app"
            xcrun simctl launch --terminate-running-process "$device" "$bundle_id" > "$RUNNER_TEMP/lantern-boot-$label.log"
            pid="$(awk 'END {print $NF}' "$RUNNER_TEMP/lantern-boot-$label.log")"
            [[ "$pid" =~ ^[0-9]+$ ]]
            sleep 14
            if kill -0 "$pid" 2>/dev/null; then
              echo "$label process is still active"
              return 0
            fi
            echo "$label process exited"
            xcrun simctl spawn "$device" log show --last 2m --style compact \
              --predicate "eventMessage CONTAINS[c] \"$bundle_id\"" \
              | grep -Ei 'SIGSEGV|code sign|termination|exc_bad|exited' | tail -n 12 || true
            return 1
          }
          template_app="$(find "$tool_fixture/bin/Debug" -type d -name '*.app' -print -quit)"
          lantern_app="$(find "$GITHUB_WORKSPACE/src/Lantern.iOS/bin/Debug" -type d -name '*.app' -print -quit)"
          test -n "$template_app" && test -n "$lantern_app"
          fixture_ok=false
          lantern_ok=false
          if sign_and_launch "$template_app" template; then fixture_ok=true; fi
          if sign_and_launch "$lantern_app" Lantern; then lantern_ok=true; fi
          echo "Stock UIKit template alive: $fixture_ok"
          echo "Lantern client alive: $lantern_ok"
          test "$fixture_ok" = true && test "$lantern_ok" = true
          lantern_data="$(xcrun simctl get_app_container "$device" com.lantern.transfer data)"
          test -d "$lantern_data/Library/Application Support/Lantern"
          echo "PASS Lantern completed native data initialization"
