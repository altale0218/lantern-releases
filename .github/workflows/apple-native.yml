name: Apple simulator build

on:
  push:
    branches: [lantern-ios-runtime-check]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26-intel
            rid: iossimulator-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_SDK: 10.0.401
      SIMULATOR_RID: ${{ matrix.rid }}
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: v0.7.21
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - name: Create and start a fresh iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          runtime="$(xcrun simctl list runtimes --json | python3 -c 'import json,sys; runtimes=[r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")]; print(max(runtimes,key=lambda r:tuple(map(int,r["version"].split("."))))["identifier"])')"
          device="$(xcrun simctl create Lantern-CI com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro "$runtime")"
          echo "LANTERN_SIMULATOR=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device"
      - name: Build the iPhone and iPad simulator app
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          dotnet new globaljson --sdk-version "$DOTNET_SDK" --roll-forward disable --force
          test "$(dotnet --version)" = "$DOTNET_SDK"
          xcodebuild -version
          dotnet workload install ios --version "$DOTNET_SDK"
          dotnet build "$GITHUB_WORKSPACE/src/Lantern.iOS/Lantern.iOS.csproj" -c Debug -r "$SIMULATOR_RID" -p:EnableCodeSigning=false
      - name: Check the bundled interface and metadata
        shell: bash
        run: |
          set -euo pipefail
          bundle="$(find src/Lantern.iOS/bin/Debug -type d -name '*.app' -print -quit)"
          test -n "$bundle"
          test -f "$bundle/ui/index.html"
          test -f "$bundle/PrivacyInfo.xcprivacy"
          plutil -lint -- "$bundle/Info.plist" "$bundle/PrivacyInfo.xcprivacy"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$bundle/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$bundle/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSBonjourServices' "$bundle/Info.plist"
      - name: Apply simulator-only ad hoc signatures
        shell: bash
        run: |
          set -euo pipefail
          app="$(find src/Lantern.iOS/bin/Debug -type d -name '*.app' -print -quit)"
          test -n "$app"
          while IFS= read -r -d '' native; do
            codesign --force --sign - --timestamp=none "$native"
          done < <(find "$app" -type f \( -name '*.dylib' -o -name '*.so' \) -print0)
          while IFS= read -r -d '' embedded; do
            codesign --force --sign - --timestamp=none "$embedded"
          done < <(find "$app" -depth -type d \( -name '*.framework' -o -name '*.appex' \) -print0)
          codesign --force --sign - --timestamp=none "$app"
          codesign --verify --deep --strict "$app"
      - name: Launch the app in an iPhone simulator
        timeout-minutes: 14
        shell: bash
        run: |
          set -euo pipefail
          app="$(find src/Lantern.iOS/bin/Debug -type d -name '*.app' -print -quit)"
          app_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          device="${LANTERN_SIMULATOR:?the simulator was not created}"
          trap 'xcrun simctl shutdown "$device" >/dev/null 2>&1 || true' EXIT
          if ! xcrun simctl bootstatus "$device" > "$RUNNER_TEMP/lantern-ios-boot.log" 2>&1; then
            tail -n 35 "$RUNNER_TEMP/lantern-ios-boot.log"
            exit 1
          fi
          xcrun simctl install "$device" "$app"
          launch_args=(--terminate-running-process)
          launch_help="$(xcrun simctl help launch 2>&1 || true)"
          if [[ "$launch_help" == *"--stdout="* && "$launch_help" == *"--stderr="* ]]; then
            launch_args+=("--stdout=$RUNNER_TEMP/lantern-app-out.log" "--stderr=$RUNNER_TEMP/lantern-app-error.log")
          fi
          xcrun simctl launch "${launch_args[@]}" "$device" "$app_id" | tee "$RUNNER_TEMP/lantern-ios-launch.log"
          pid="$(awk 'END {print $NF}' "$RUNNER_TEMP/lantern-ios-launch.log")"
          [[ "$pid" =~ ^[0-9]+$ ]]
          data="$(xcrun simctl get_app_container "$device" "$app_id" data)"
          for elapsed in 10 20 30 40 50 60 70; do
            sleep 10
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            echo "Simulator app process alive after $elapsed seconds"
            if test -d "$data/Library/Application Support/Lantern"; then
              echo "Lantern data setup reached after $elapsed seconds"
              break
            fi
          done
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "iPhone simulator app exited early; collecting only relevant failure details"
            grep -Eh 'Unhandled|Exception|Error|Abort|Fatal|^   at ' "$RUNNER_TEMP/lantern-app-out.log" "$RUNNER_TEMP/lantern-app-error.log" | tail -n 25 || true
            executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
            xcrun simctl spawn "$device" log show --last 2m --info --style compact \
              --predicate "processID == $pid OR process == \"$executable\" OR eventMessage CONTAINS[c] \"$app_id\"" \
              | grep -Ei 'Unhandled|Abort|dyld|Fatal|Symbol not found|Exception|crashed|termination|exited|code sign|lantern\.ios' | tail -n 35 || true
            sleep 12
            find "$HOME/Library/Logs/DiagnosticReports" "$HOME/Library/Developer/CoreSimulator/Devices/$device/data/Library/Logs" \
              -type f -name '*Lantern*.ips' -mmin -10 -print0 2>/dev/null | while IFS= read -r -d '' report; do
              python3 - "$report" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              stream.readline()
              data=json.load(stream)
          exception=data.get("exception") or {}
          termination=data.get("termination") or {}
          print("Crash signal:", exception.get("type"), exception.get("signal"))
          print("Crash termination:", termination.get("namespace"), termination.get("code"), termination.get("indicator"))
          for detail in data.get("asi", {}).values():
              for line in detail:
                  if any(marker in line for marker in ("Symbol not found", "Library not loaded", "no suitable image", "Assertion failed")):
                      print(line.rsplit("/",1)[-1][:180])
          PY
            done || true
            exit 1
          fi
          if ! test -d "$data/Library/Application Support/Lantern"; then
            echo "Process alive but application data has not been initialized"
            screenshot="$RUNNER_TEMP/lantern-screen.png"
            xcrun simctl io "$device" screenshot "$screenshot"
            cat > "$RUNNER_TEMP/ocr.swift" <<'SWIFT'
          import Foundation
          import Vision
          let request = VNRecognizeTextRequest()
          request.recognitionLanguages = ["zh-Hans", "en-US"]
          let handler = VNImageRequestHandler(url: URL(fileURLWithPath: CommandLine.arguments[1]))
          try handler.perform([request])
          let visibleText = (request.results ?? []).compactMap { $0.topCandidates(1).first?.string }.joined(separator: " ")
          for label in ["Lantern", "闪传", "传输", "聊天", "设置", "相机", "Camera", "App Store"] {
              if visibleText.localizedCaseInsensitiveContains(label) { print("Visible label:", label) }
          }
          SWIFT
            swift "$RUNNER_TEMP/ocr.swift" "$screenshot" || true
            executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
            xcrun simctl spawn "$device" log show --last 3m --info --style compact \
              --predicate "process == \"$executable\" OR eventMessage CONTAINS[c] \"$app_id\"" \
              | grep -Ei 'scene|launch|connection|exception|codesign|foreground|springboard|denied|failed' | tail -n 32 || true
            exit 1
          fi
          echo "PASS iPhone simulator launch reached the native app data setup and the process is still running"
